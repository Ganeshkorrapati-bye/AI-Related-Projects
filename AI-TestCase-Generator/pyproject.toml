[project]
name = "ai-testcase-generator"
version = "1.0.0"
description = "AI-powered enterprise QA documentation generator (Streamlit + OpenAI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
